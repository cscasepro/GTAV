<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Web - Franklin</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            pointer-events: none;
            border-left: 4px solid #2ecc71;
        }
        #hud b {
            color: #2ecc71;
        }
    </style>
</head>
<body>
    <div id="hud">
        <b>STEROWANIE:</b><br>
        <b>W / S / A / D</b> – Ruch i obracanie<br>
        <b>1</b> – Zwykłe chodzenie<br>
        <b>2</b> – Tryb z pistoletem<br>
        <b>3</b> – Tryb z karabinem<br>
        <b>4</b> – Pływanie<br>
        <b>F</b> – Cios (Boks)<br>
        <b>G</b> – Otrzymanie ciosu (Uppercut)<br>
        <b>K</b> – Śmierć (Restart po chwili)
    </div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>
